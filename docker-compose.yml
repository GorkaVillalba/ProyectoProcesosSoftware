services:
  mysql:
    image: mysql:8.0
    container_name: eventpass-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  app:
    build: .
    container_name: eventpass-app
    ports:
      - "8080:8080"
    environment:
      # Descomenta para arrancar con datos de demo precargados:
      # SPRING_PROFILES_ACTIVE: demo
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: eventpass-prod-secret-key-que-debe-tener-al-menos-256-bits-segura-1234567890
      SPRING_DATASOURCE_URL: jdbc:h2:mem:eventpass-demo;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
