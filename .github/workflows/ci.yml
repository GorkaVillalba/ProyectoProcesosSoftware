name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache de Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Dar permisos a Gradle Wrapper
      run: chmod +x ./gradlew

    - name: Build (sin tests)
      run: ./gradlew build -x test

    - name: Ejecutar tests unitarios
      run: ./gradlew test

    - name: Generar reporte de cobertura (JaCoCo)
      if: always()
      run: ./gradlew jacocoTestReport

    - name: Verificar umbral mínimo de cobertura
      if: always()
      run: ./gradlew jacocoTestCoverageVerification
      continue-on-error: true

    # ─────────────────────────────────────────────────────────────────
    # T-29.9: validar que la Javadoc se genera sin errores en cada PR.
    #
    # Por defecto, la tarea `javadoc` definida en build.gradle tiene
    # `Xdoclint:none` y `failOnError = false`, lo que silencia tanto los
    # avisos de calidad (parámetros mal nombrados, @link rotos, HTML
    # malformado, etc.) como los fallos del propio generador.
    #
    # Para que el step cumpla su propósito en CI, aquí inyectamos un
    # init-script con `--init-script` que reactiva la validación estricta
    # SOLO durante esta ejecución, sin tocar el build.gradle del
    # repositorio. Así los desarrolladores conservan el comportamiento
    # permisivo en local y la CI bloquea los PRs con Javadoc rota.
    #
    # Se excluye el grupo `missing` para no fallar por métodos sin
    # documentar (eso lo cubrirá `jacocoTestCoverageVerification` con su
    # umbral si en el futuro se mide cobertura de Javadoc); aquí solo
    # buscamos errores estructurales.
    # ─────────────────────────────────────────────────────────────────
    - name: Validar Javadoc (T-29.9)
      if: always()
      run: |
        cat > /tmp/javadoc-strict.gradle <<'GRADLE'
        allprojects {
            afterEvaluate {
                tasks.withType(Javadoc).configureEach {
                    failOnError = true
                    options.encoding = 'UTF-8'
                    options.docEncoding = 'UTF-8'
                    options.charSet = 'UTF-8'
                    // Reemplaza el Xdoclint:none del build.gradle por
                    // validación estricta excepto avisos de "missing".
                    options.addStringOption('Xdoclint:all,-missing', '-quiet')
                }
            }
        }
        GRADLE
        ./gradlew javadoc --init-script /tmp/javadoc-strict.gradle --no-daemon

    - name: Publicar Javadoc generada
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: javadoc
        path: build/docs/javadoc/

    - name: Publicar resultados de tests
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/tests/

    - name: Publicar reporte de cobertura JaCoCo
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: build/reports/jacoco/test/
    - name: Análisis SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonar --info